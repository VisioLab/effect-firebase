packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@changesets/cli": ^3.0.3
  "@effect/tsgo": 0.45.0
  "@effect/vitest": ^4.0.0-rc.115
  "@types/node": ^24
  effect: ^4.0.0-rc.115
  firebase-admin: ^14.2.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  "@firebase/util": false
  msgpackr-extract: true
  protobufjs: false
