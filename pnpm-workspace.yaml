packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@changesets/cli": ^3.0.3
  "@effect/tsgo": 0.63.0
  "@effect/vitest": ^4.1.0
  # Exact: toCodecFirestore builds on Effect's @internal SchemaAST helpers
  # (ADR 0002), which a patch release may change without notice.
  effect: 4.1.0
  firebase: ^13.0.0
  firebase-admin: ^14.5.0
  firebase-tools: 15.34.0
  tstyche: ^7.2.5
  typescript: ^7.0.2
  # TSTyche 7 cannot load the native TypeScript 7 package, so type tests run on
  # TypeScript 6.0 instead. The root `test-types` script points TSTyche at this
  # alias. Revisit once TypeScript 7.1 and TSTyche 8 are both stable (#94).
  typescript6: npm:typescript@6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
allowBuilds:
  "@firebase/util": false
  msgpackr-extract: true
  protobufjs: false
  re2: false
minimumReleaseAgeExclude:
  - "@effect/tsgo-darwin-arm64@0.48.1 || 0.51.0"
  - "@effect/tsgo-darwin-x64@0.48.1 || 0.51.0"
  - "@effect/tsgo-linux-arm64@0.48.1 || 0.51.0"
  - "@effect/tsgo-linux-arm@0.48.1 || 0.51.0"
  - "@effect/tsgo-linux-x64@0.48.1 || 0.51.0"
  - "@effect/tsgo-win32-arm64@0.48.1 || 0.51.0"
  - "@effect/tsgo-win32-x64@0.48.1 || 0.51.0"
  - "@effect/tsgo@0.48.1 || 0.51.0"
  - "@effect/vitest@4.0.1"
  - effect@4.0.1
  - "@voidzero-dev/vite-plus-core@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - vite-plus@1.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
