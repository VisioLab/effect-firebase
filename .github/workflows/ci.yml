name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (format, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: "24"
          cache: true

      - run: vp check

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      # The Firestore emulator is a Java program, and firebase-tools asks for
      # Java 21 or later to run it.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # firebase-tools downloads the emulator on first use. Its version follows
      # firebase-tools', which the catalog pins.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-workspace.yaml') }}
          restore-keys: firebase-emulators-

      - run: vp exec firebase emulators:exec --only firestore --project demo-effect-firebase "vp test"

  ci:
    name: CI
    if: always()
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: needs.check.result != 'success' || needs.test.result != 'success'
        run: exit 1
