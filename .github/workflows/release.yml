name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # version PR commits, release tags
  packages: write # publish to npm.pkg.github.com
  pull-requests: write # open the version PR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: "24"
          cache: true
          registry-url: https://npm.pkg.github.com

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: vp exec changeset publish
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
